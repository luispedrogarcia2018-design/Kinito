<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - Tienda de Ropa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="d-flex">
    <nav class="bg-dark text-white p-3" style="width: 240px; min-height: 100vh;">
        <h5 class="mb-4">🏝️ Tienda de Ropa</h5>
        <ul class="nav nav-pills flex-column gap-1">
            <li class="nav-item"><a class="nav-link text-white-50" th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
            <li class="nav-item"><a class="nav-link text-white-50" th:href="@{/admin/productos}"><i class="bi bi-tags me-2"></i>Productos</a></li>
            <li class="nav-item"><a class="nav-link text-white-50" th:href="@{/admin/inventario}"><i class="bi bi-box-seam me-2"></i>Inventario</a></li>
            <li class="nav-item"><a class="nav-link text-white-50" th:href="@{/admin/entradas}"><i class="bi bi-truck me-2"></i>Entradas</a></li>
            <li class="nav-item"><a class="nav-link text-white-50" th:href="@{/admin/ventas}"><i class="bi bi-cart-check me-2"></i>Ventas</a></li>
            <li class="nav-item"><a class="nav-link text-white-50" th:href="@{/admin/clientes}"><i class="bi bi-people me-2"></i>Clientes</a></li>
            <li class="nav-item"><a class="nav-link text-white-50" th:href="@{/admin/proveedores}"><i class="bi bi-building me-2"></i>Proveedores</a></li>
            <li class="nav-item"><a class="nav-link text-white active" th:href="@{/admin/usuarios}"><i class="bi bi-person-badge me-2"></i>Usuarios</a></li>
        </ul>
        <form th:action="@{/logout}" method="post" class="mt-4">
            <button class="btn btn-outline-light btn-sm w-100" type="submit">
                <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
            </button>
        </form>
    </nav>

    <main class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">Usuarios</h1>
            <a class="btn btn-primary" th:href="@{/admin/usuarios/nuevo}">
                <i class="bi bi-plus-lg me-1"></i> Nuevo usuario
            </a>
        </div>

        <div th:if="${mensajeExito}" class="alert alert-success" th:text="${mensajeExito}"></div>

        <div class="card">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Nombre</th>
                        <th>Usuario</th>
                        <th>Correo</th>
                        <th>Rol</th>
                        <th>Estado</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${usuarios}">
                        <td th:text="${u.nombre}">Nombre</td>
                        <td th:text="${u.username}">username</td>
                        <td th:text="${u.correo}">correo</td>
                        <td><span class="badge bg-info text-dark" th:text="${u.rol.nombre}">ROL</span></td>
                        <td>
                            <span class="badge bg-success" th:if="${u.estado.name() == 'ACTIVO'}">Activo</span>
                            <span class="badge bg-secondary" th:unless="${u.estado.name() == 'ACTIVO'}">Inactivo</span>
                        </td>
                        <td class="text-end">
                            <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/usuarios/editar/{id}(id=${u.id})}" title="Editar">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/usuarios/cambiar-password/{id}(id=${u.id})}" title="Cambiar contraseña">
                                <i class="bi bi-key"></i>
                            </a>
                            <form th:if="${u.estado.name() == 'ACTIVO'}" th:action="@{/admin/usuarios/desactivar/{id}(id=${u.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('¿Desactivar este usuario?');">
                                <button class="btn btn-sm btn-outline-danger" type="submit" title="Desactivar"><i class="bi bi-slash-circle"></i></button>
                            </form>
                            <form th:unless="${u.estado.name() == 'ACTIVO'}" th:action="@{/admin/usuarios/reactivar/{id}(id=${u.id})}" method="post" class="d-inline">
                                <button class="btn btn-sm btn-outline-success" type="submit" title="Reactivar"><i class="bi bi-check-circle"></i></button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
</body>
</html>
