<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva venta - Tienda de Ropa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="d-flex">
    <nav class="bg-dark text-white p-3" style="width: 240px; min-height: 100vh;">
        <h5 class="mb-4">🏝️ Tienda de Ropa</h5>
        <ul class="nav nav-pills flex-column gap-1">
            <li class="nav-item"><a class="nav-link text-white-50" th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
            <li class="nav-item"><a class="nav-link text-white-50" th:href="@{/admin/productos}"><i class="bi bi-tags me-2"></i>Productos</a></li>
            <li class="nav-item"><a class="nav-link text-white-50" th:href="@{/admin/inventario}"><i class="bi bi-box-seam me-2"></i>Inventario</a></li>
            <li class="nav-item"><a class="nav-link text-white-50" th:href="@{/admin/entradas}"><i class="bi bi-truck me-2"></i>Entradas</a></li>
            <li class="nav-item"><a class="nav-link text-white active" th:href="@{/admin/ventas}"><i class="bi bi-cart-check me-2"></i>Ventas</a></li>
            <li class="nav-item"><a class="nav-link text-white-50" th:href="@{/admin/proveedores}"><i class="bi bi-building me-2"></i>Proveedores</a></li>
        </ul>
        <form th:action="@{/logout}" method="post" class="mt-4">
            <button class="btn btn-outline-light btn-sm w-100" type="submit">
                <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
            </button>
        </form>
    </nav>

    <main class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">Nueva venta</h1>
            <form th:action="@{/admin/ventas/nueva/cancelar}" method="post" onsubmit="return confirm('¿Vaciar el carrito y cancelar?');">
                <button type="submit" class="btn btn-outline-danger btn-sm">
                    <i class="bi bi-x-circle me-1"></i> Cancelar venta
                </button>
            </form>
        </div>

        <div th:if="${errorNegocio}" class="alert alert-danger" th:text="${errorNegocio}"></div>

        <!-- Agregar producto al carrito -->
        <div class="card card-body mb-4">
            <h2 class="h6 mb-3">Agregar producto</h2>
            <form th:action="@{/admin/ventas/nueva/agregar}" th:object="${itemForm}" method="post" class="row g-2 align-items-end">
                <div class="col-md-8">
                    <label class="form-label">Producto (talla / color)</label>
                    <select th:field="*{varianteId}" class="form-select">
                        <option value="">-- Selecciona --</option>
                        <option th:each="v : ${variantes}" th:value="${v.id}"
                                th:text="${v.producto.nombre + ' — ' + v.color.nombre + ' / ' + v.talla.nombre + ' (' + v.skuVariante + ')'}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Cantidad</label>
                    <input type="number" min="1" th:field="*{cantidad}" class="form-control">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-cart-plus"></i> Agregar
                    </button>
                </div>
            </form>
        </div>

        <!-- Carrito actual -->
        <div class="card mb-4">
            <div class="card-body p-0">
                <table class="table align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Producto</th>
                        <th class="text-end">Cantidad</th>
                        <th class="text-end">Precio</th>
                        <th class="text-end">Subtotal</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${carrito}">
                        <td th:text="${item.descripcion}">Producto</td>
                        <td class="text-end" th:text="${item.cantidad}">0</td>
                        <td class="text-end" th:text="'Q ' + ${#numbers.formatDecimal(item.precioUnitario, 1, 2)}">Q 0.00</td>
                        <td class="text-end fw-semibold" th:text="'Q ' + ${#numbers.formatDecimal(item.subtotal, 1, 2)}">Q 0.00</td>
                        <td class="text-end">
                            <form th:action="@{/admin/ventas/nueva/quitar/{id}(id=${item.varianteId})}" method="post">
                                <button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(carrito)}">
                        <td colspan="5" class="text-center text-muted py-4">El carrito está vacío. Agrega productos arriba.</td>
                    </tr>
                    </tbody>
                    <tfoot th:if="${!#lists.isEmpty(carrito)}">
                    <tr class="table-light">
                        <th colspan="3" class="text-end">SUBTOTAL</th>
                        <th class="text-end" th:text="'Q ' + ${#numbers.formatDecimal(subtotalCarrito, 1, 2)}">Q 0.00</th>
                        <th></th>
                    </tr>
                    </tfoot>
                </table>
            </div>
        </div>

        <!-- Confirmar venta -->
        <div class="card card-body" th:if="${!#lists.isEmpty(carrito)}">
            <h2 class="h6 mb-3">Finalizar venta</h2>
            <form th:action="@{/admin/ventas/nueva/confirmar}" th:object="${confirmarForm}" method="post" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Cliente *</label>
                    <select th:field="*{clienteId}" class="form-select"
                            th:classappend="${#fields.hasErrors('clienteId')} ? 'is-invalid'">
                        <option value="">-- Selecciona --</option>
                        <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nombreCompleto}"></option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('clienteId')}" th:errors="*{clienteId}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Método de pago *</label>
                    <select th:field="*{metodoPagoId}" class="form-select"
                            th:classappend="${#fields.hasErrors('metodoPagoId')} ? 'is-invalid'">
                        <option value="">-- Selecciona --</option>
                        <option th:each="m : ${metodosPago}" th:value="${m.id}" th:text="${m.nombre}"></option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('metodoPagoId')}" th:errors="*{metodoPagoId}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Descuento (Q)</label>
                    <input type="number" step="0.01" min="0" th:field="*{descuento}" class="form-control">
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-success btn-lg">
                        <i class="bi bi-check-circle me-1"></i> Confirmar venta
                    </button>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
