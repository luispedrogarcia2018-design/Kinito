<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Tienda de Ropa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div class="d-flex">
    <nav class="bg-dark text-white p-3" style="width: 240px; min-height: 100vh;">
        <h5 class="mb-4">🏝️ Tienda de Ropa</h5>
        <ul class="nav nav-pills flex-column gap-1">
            <li class="nav-item"><a class="nav-link text-white active" th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
            <li class="nav-item"><a class="nav-link text-white-50" th:href="@{/admin/productos}"><i class="bi bi-tags me-2"></i>Productos</a></li>
            <li class="nav-item"><a class="nav-link text-white-50" th:href="@{/admin/inventario}"><i class="bi bi-box-seam me-2"></i>Inventario</a></li>
            <li class="nav-item"><a class="nav-link text-white-50" th:href="@{/admin/entradas}"><i class="bi bi-truck me-2"></i>Entradas</a></li>
            <li class="nav-item"><a class="nav-link text-white-50" href="#"><i class="bi bi-cart-check me-2"></i>Ventas</a></li>
        </ul>
        <form th:action="@{/logout}" method="post" class="mt-4">
            <button class="btn btn-outline-light btn-sm w-100" type="submit">
                <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
            </button>
        </form>
    </nav>

    <main class="flex-grow-1 p-4">
        <h1 class="h3">¡Bienvenido, <span th:text="${usuario.nombre}">Usuario</span>!</h1>
        <p class="text-muted">
            Rol: <span th:text="${usuario.rol.nombre}">ROL</span>
        </p>
        <div class="alert alert-success mt-4">
            Ya puedes administrar productos desde el menú lateral. El dashboard
            con indicadores y gráficos reales se construye más adelante.
        </div>
    </main>
</div>
</body>
</html>
