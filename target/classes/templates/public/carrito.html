<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi carrito - Tienda de Ropa</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/tienda.css}" rel="stylesheet">
</head>
<body class="tienda-publica">

<div th:replace="~{public/fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <h1 class="h3 mb-4">Mi carrito</h1>

    <div th:if="${mensajeExito}" class="alert alert-success" th:text="${mensajeExito}"></div>
    <div th:if="${mensajeError}" class="alert alert-danger" th:text="${mensajeError}"></div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Producto</th>
                    <th class="text-end">Cantidad</th>
                    <th class="text-end">Precio</th>
                    <th class="text-end">Subtotal</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${carrito}">
                    <td th:text="${item.descripcion}">Producto</td>
                    <td class="text-end" th:text="${item.cantidad}">0</td>
                    <td class="text-end" th:text="'Q ' + ${#numbers.formatDecimal(item.precioUnitario, 1, 2)}">Q 0.00</td>
                    <td class="text-end fw-semibold" th:text="'Q ' + ${#numbers.formatDecimal(item.subtotal, 1, 2)}">Q 0.00</td>
                    <td class="text-end">
                        <form th:action="@{/carrito/quitar/{id}(id=${item.varianteId})}" method="post">
                            <button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(carrito)}">
                    <td colspan="5" class="text-center text-muted py-5">
                        Tu carrito está vacío. <a th:href="@{/productos}">Ver productos</a>
                    </td>
                </tr>
                </tbody>
                <tfoot th:if="${!#lists.isEmpty(carrito)}">
                <tr class="table-light">
                    <th colspan="3" class="text-end">TOTAL</th>
                    <th class="text-end fs-5" th:text="'Q ' + ${#numbers.formatDecimal(total, 1, 2)}">Q 0.00</th>
                    <th></th>
                </tr>
                </tfoot>
            </table>
        </div>
    </div>

    <div class="d-flex justify-content-between mt-4" th:if="${!#lists.isEmpty(carrito)}">
        <form th:action="@{/carrito/vaciar}" method="post">
            <button class="btn btn-outline-secondary" type="submit">Vaciar carrito</button>
        </form>
        <div class="text-end">
            <p class="text-muted small mb-2">Para completar tu compra, contáctanos o visita nuestra tienda.</p>
            <a href="#contacto" class="btn btn-tienda-primario btn-lg">
                <i class="bi bi-whatsapp me-1"></i> Contactar para finalizar compra
            </a>
        </div>
    </div>
</div>

<div th:replace="~{public/fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
