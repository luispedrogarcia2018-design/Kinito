<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de inventario - Tienda de Ropa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="d-flex">
    <nav class="bg-dark text-white p-3" style="width: 240px; min-height: 100vh;">
        <h5 class="mb-4">🏝️ Tienda de Ropa</h5>
        <p class="text-white-50 small">
            <a th:href="@{/admin/reportes}" class="text-white-50"><i class="bi bi-arrow-left me-1"></i> Reportes</a>
        </p>
        <form th:action="@{/logout}" method="post" class="mt-4">
            <button class="btn btn-outline-light btn-sm w-100" type="submit">
                <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
            </button>
        </form>
    </nav>

    <main class="flex-grow-1 p-4">
        <h1 class="h3 mb-4">Reporte de inventario</h1>

        <ul class="nav nav-tabs mb-3" id="tabs" role="tablist">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-actual" type="button">Inventario actual</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-bajo" type="button">Stock bajo (<span th:text="${#lists.size(stockBajo)}">0</span>)</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-agotados" type="button">Agotados (<span th:text="${#lists.size(agotados)}">0</span>)</button></li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="tab-actual">
                <div class="card">
                    <div class="card-body p-0">
                        <table class="table align-middle mb-0">
                            <thead class="table-light"><tr><th>Producto</th><th>Talla</th><th>Color</th><th class="text-end">Stock</th><th>Estado</th></tr></thead>
                            <tbody>
                            <tr th:each="inv : ${inventarioActual}">
                                <td th:text="${inv.variante.producto.nombre}">Producto</td>
                                <td th:text="${inv.variante.talla.nombre}">Talla</td>
                                <td th:text="${inv.variante.color.nombre}">Color</td>
                                <td class="text-end" th:text="${inv.stockActual}">0</td>
                                <td>
                                    <span th:if="${inv.estadoStock.name() == 'DISPONIBLE'}" class="badge bg-success">Disponible</span>
                                    <span th:if="${inv.estadoStock.name() == 'STOCK_BAJO'}" class="badge bg-warning text-dark">Stock bajo</span>
                                    <span th:if="${inv.estadoStock.name() == 'AGOTADO'}" class="badge bg-danger">Agotado</span>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="tab-bajo">
                <div class="card">
                    <div class="card-body p-0">
                        <table class="table align-middle mb-0">
                            <thead class="table-light"><tr><th>Producto</th><th>Talla</th><th>Color</th><th class="text-end">Stock</th><th class="text-end">Mínimo</th></tr></thead>
                            <tbody>
                            <tr th:each="inv : ${stockBajo}">
                                <td th:text="${inv.variante.producto.nombre}">Producto</td>
                                <td th:text="${inv.variante.talla.nombre}">Talla</td>
                                <td th:text="${inv.variante.color.nombre}">Color</td>
                                <td class="text-end text-warning fw-semibold" th:text="${inv.stockActual}">0</td>
                                <td class="text-end" th:text="${inv.stockMinimo}">0</td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(stockBajo)}"><td colspan="5" class="text-center text-muted py-4">No hay productos con stock bajo.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="tab-agotados">
                <div class="card">
                    <div class="card-body p-0">
                        <table class="table align-middle mb-0">
                            <thead class="table-light"><tr><th>Producto</th><th>Talla</th><th>Color</th></tr></thead>
                            <tbody>
                            <tr th:each="inv : ${agotados}">
                                <td th:text="${inv.variante.producto.nombre}">Producto</td>
                                <td th:text="${inv.variante.talla.nombre}">Talla</td>
                                <td th:text="${inv.variante.color.nombre}">Color</td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(agotados)}"><td colspan="3" class="text-center text-muted py-4">No hay productos agotados.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
