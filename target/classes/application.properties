# ==========================================================
#  Configuracion general
# ==========================================================
spring.application.name=tienda-ropa
server.port=8080

# ==========================================================
#  Base de datos MySQL
#  Esta app se conecta a la base de datos "tienda_ropa_db" que ya
#  creaste con los scripts 01_database.sql...05_seed_data.sql.
#  NUNCA escribas tu password real aqui. Antes de correr la app,
#  define la variable de entorno DB_PASSWORD en tu terminal:
#
#    export DB_PASSWORD=tu_password_de_mysql
#
#  (la que definiste con el ALTER USER cuando reseteaste root)
#  Si tu MySQL usa otro usuario o esta en otra maquina/puerto,
#  tambien puedes sobreescribir DB_URL y DB_USER de la misma forma.
# ==========================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tienda_ropa_db?useSSL=false&serverTimezone=America/Guatemala&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================================
#  JPA / Hibernate
#  ddl-auto=validate: la base de datos YA existe (la creaste con los
#  scripts SQL) y ya tiene datos, asi que Hibernate NO debe intentar
#  crear ni modificar tablas -- solo valida que las entidades Java
#  coincidan con las columnas reales, y avisa si algo no calza.
# ==========================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# No hay data.sql: los datos de prueba ya se cargaron con 05_seed_data.sql
spring.sql.init.mode=never

# ==========================================================
#  Subida de archivos (fotos de productos)
# ==========================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads/productos

# ==========================================================
#  Thymeleaf
# ==========================================================
spring.thymeleaf.cache=false

# ==========================================================
#  Logging
# ==========================================================
logging.level.com.tienda.ropa=INFO
logging.level.org.hibernate.SQL=WARN
