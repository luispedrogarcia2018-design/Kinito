# === Servidor ===
server.port=8080

# === Base de datos H2 (archivo local en la carpeta del proyecto, no requiere instalar nada) ===
spring.datasource.url=jdbc:h2:file:./data/kinito;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# === JPA / Hibernate ===
# update: crea/actualiza las tablas automáticamente según las clases @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# === Consola web de H2, para ver las tablas y correr SQL a mano ===
# Disponible en http://localhost:8080/h2-console
# JDBC URL a usar ahí: jdbc:h2:file:./data/kinito
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# === Carga de datos de ejemplo ===
# Solo inserta datos si las tablas están vacías (ver DataLoader.java)
spring.jpa.defer-datasource-initialization=true
