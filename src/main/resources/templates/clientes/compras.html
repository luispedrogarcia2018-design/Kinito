<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compras del cliente - Tienda de Ropa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="d-flex">
    <nav class="bg-dark text-white p-3" style="width: 240px; min-height: 100vh;">
        <h5 class="mb-4">🏝️ Tienda de Ropa</h5>
        <ul class="nav nav-pills flex-column gap-1">
            <li class="nav-item"><a class="nav-link text-white-50" th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
            <li class="nav-item"><a class="nav-link text-white active" th:href="@{/admin/clientes}"><i class="bi bi-people me-2"></i>Clientes</a></li>
        </ul>
        <form th:action="@{/logout}" method="post" class="mt-4">
            <button class="btn btn-outline-light btn-sm w-100" type="submit">
                <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
            </button>
        </form>
    </nav>

    <main class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">Compras de <span th:text="${cliente.nombreCompleto}">Cliente</span></h1>
            <a th:href="@{/admin/clientes}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i> Volver
            </a>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <table class="table align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Número</th>
                        <th>Fecha</th>
                        <th>Vendedor</th>
                        <th>Método de pago</th>
                        <th class="text-end">Total</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="v : ${ventas}">
                        <td>
                            <a th:href="@{/admin/ventas/{id}(id=${v.id})}" th:text="${v.numeroVenta}">VEN-00001</a>
                        </td>
                        <td th:text="${#temporals.format(v.fechaHora, 'dd/MM/yyyy HH:mm')}">Fecha</td>
                        <td th:text="${v.usuario.nombre}">Vendedor</td>
                        <td th:text="${v.metodoPago.nombre}">Método</td>
                        <td class="text-end" th:text="'Q ' + ${#numbers.formatDecimal(v.total, 1, 2)}">Q 0.00</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(ventas)}">
                        <td colspan="5" class="text-center text-muted py-4">Este cliente todavía no tiene compras registradas.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
</body>
</html>
