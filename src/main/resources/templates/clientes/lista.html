<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - Tienda de Ropa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="d-flex">
    <nav class="bg-dark text-white p-3" style="width: 240px; min-height: 100vh;">
        <h5 class="mb-4">🏝️ Tienda de Ropa</h5>
        <ul class="nav nav-pills flex-column gap-1">
            <li class="nav-item"><a class="nav-link text-white-50" th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
            <li class="nav-item"><a class="nav-link text-white-50" th:href="@{/admin/productos}"><i class="bi bi-tags me-2"></i>Productos</a></li>
            <li class="nav-item"><a class="nav-link text-white-50" th:href="@{/admin/inventario}"><i class="bi bi-box-seam me-2"></i>Inventario</a></li>
            <li class="nav-item"><a class="nav-link text-white-50" th:href="@{/admin/entradas}"><i class="bi bi-truck me-2"></i>Entradas</a></li>
            <li class="nav-item"><a class="nav-link text-white-50" th:href="@{/admin/ventas}"><i class="bi bi-cart-check me-2"></i>Ventas</a></li>
            <li class="nav-item"><a class="nav-link text-white active" th:href="@{/admin/clientes}"><i class="bi bi-people me-2"></i>Clientes</a></li>
            <li class="nav-item"><a class="nav-link text-white-50" th:href="@{/admin/proveedores}"><i class="bi bi-building me-2"></i>Proveedores</a></li>
        </ul>
        <form th:action="@{/logout}" method="post" class="mt-4">
            <button class="btn btn-outline-light btn-sm w-100" type="submit">
                <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
            </button>
        </form>
    </nav>

    <main class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">Clientes</h1>
            <a class="btn btn-primary" sec:authorize="hasRole('ADMIN')" th:href="@{/admin/clientes/nuevo}">
                <i class="bi bi-plus-lg me-1"></i> Nuevo cliente
            </a>
        </div>

        <div th:if="${mensajeExito}" class="alert alert-success" th:text="${mensajeExito}"></div>

        <div class="card">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Nombre</th>
                        <th>NIT</th>
                        <th>Teléfono</th>
                        <th>Correo</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${clientes}">
                        <td th:text="${c.nombreCompleto}">Nombre</td>
                        <td th:text="${c.nit}">NIT</td>
                        <td th:text="${c.telefono}">Teléfono</td>
                        <td th:text="${c.correo}">Correo</td>
                        <td class="text-end">
                            <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/clientes/{id}/compras(id=${c.id})}" title="Historial de compras">
                                <i class="bi bi-bag-check"></i>
                            </a>
                            <a class="btn btn-sm btn-outline-secondary" sec:authorize="hasRole('ADMIN')"
                               th:href="@{/admin/clientes/editar/{id}(id=${c.id})}">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/admin/clientes/desactivar/{id}(id=${c.id})}" method="post" class="d-inline"
                                  sec:authorize="hasRole('ADMIN')" onsubmit="return confirm('¿Desactivar este cliente?');">
                                <button class="btn btn-sm btn-outline-danger" type="submit">
                                    <i class="bi bi-slash-circle"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(clientes)}">
                        <td colspan="5" class="text-center text-muted py-4">No hay clientes registrados todavía.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
</body>
</html>
