<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajustar stock - Tienda de Ropa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="d-flex">
    <nav class="bg-dark text-white p-3" style="width: 240px; min-height: 100vh;">
        <h5 class="mb-4">🏝️ Tienda de Ropa</h5>
        <ul class="nav nav-pills flex-column gap-1">
            <li class="nav-item"><a class="nav-link text-white-50" th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
            <li class="nav-item"><a class="nav-link text-white-50" th:href="@{/admin/productos}"><i class="bi bi-tags me-2"></i>Productos</a></li>
            <li class="nav-item"><a class="nav-link text-white active" th:href="@{/admin/inventario}"><i class="bi bi-box-seam me-2"></i>Inventario</a></li>
            <li class="nav-item"><a class="nav-link text-white-50" th:href="@{/admin/entradas}"><i class="bi bi-truck me-2"></i>Entradas</a></li>
            <li class="nav-item"><a class="nav-link text-white-50" th:href="@{/admin/ventas}"><i class="bi bi-cart-check me-2"></i>Ventas</a></li>
            <li class="nav-item"><a class="nav-link text-white-50" th:href="@{/admin/clientes}"><i class="bi bi-people me-2"></i>Clientes</a></li>
            <li class="nav-item"><a class="nav-link text-white-50" th:href="@{/admin/proveedores}"><i class="bi bi-building me-2"></i>Proveedores</a></li>
            <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link text-white-50" th:href="@{/admin/usuarios}"><i class="bi bi-person-badge me-2"></i>Usuarios</a></li>
        </ul>
        <form th:action="@{/logout}" method="post" class="mt-4">
            <button class="btn btn-outline-light btn-sm w-100" type="submit">
                <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
            </button>
        </form>
    </nav>

    <main class="flex-grow-1 p-4" style="max-width: 700px;">
        <h1 class="h3 mb-1">Ajustar stock</h1>
        <p class="text-muted" th:if="${inventario != null}">
            <strong th:text="${inventario.variante.producto.nombre}">Producto</strong> —
            <span th:text="${inventario.variante.color.nombre}">Color</span> /
            <span th:text="${inventario.variante.talla.nombre}">Talla</span>
            · Stock actual: <strong th:text="${inventario.stockActual}">0</strong>
        </p>

        <div th:if="${errorNegocio}" class="alert alert-danger" th:text="${errorNegocio}"></div>

        <form th:action="@{/admin/inventario/ajuste}" th:object="${ajusteForm}" method="post" class="card card-body">
            <input type="hidden" th:field="*{varianteId}">

            <div class="mb-3">
                <label class="form-label">Tipo de ajuste *</label>
                <select th:field="*{tipo}" class="form-select"
                        th:classappend="${#fields.hasErrors('tipo')} ? 'is-invalid'">
                    <option value="">-- Selecciona --</option>
                    <option value="POSITIVO">Positivo (aumentar stock)</option>
                    <option value="NEGATIVO">Negativo (disminuir stock)</option>
                </select>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Cantidad *</label>
                <input type="number" min="1" th:field="*{cantidad}" class="form-control"
                       th:classappend="${#fields.hasErrors('cantidad')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('cantidad')}" th:errors="*{cantidad}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Motivo *</label>
                <textarea th:field="*{motivo}" class="form-control" rows="2"
                          placeholder="Ej. Conteo físico, producto dañado, corrección de carga inicial..."
                          th:classappend="${#fields.hasErrors('motivo')} ? 'is-invalid'"></textarea>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('motivo')}" th:errors="*{motivo}"></div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg me-1"></i> Aplicar ajuste
                </button>
                <a th:href="@{/admin/inventario}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </main>
</div>
</body>
</html>
