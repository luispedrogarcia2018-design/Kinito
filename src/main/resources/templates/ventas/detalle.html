<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venta <span th:text="${venta.numeroVenta}"></span> - Tienda de Ropa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="d-flex">
    <nav class="bg-dark text-white p-3" style="width: 240px; min-height: 100vh;">
        <h5 class="mb-4">🏝️ Tienda de Ropa</h5>
        <ul class="nav nav-pills flex-column gap-1">
            <li class="nav-item"><a class="nav-link text-white-50" th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
            <li class="nav-item"><a class="nav-link text-white active" th:href="@{/admin/ventas}"><i class="bi bi-cart-check me-2"></i>Ventas</a></li>
        </ul>
        <form th:action="@{/logout}" method="post" class="mt-4">
            <button class="btn btn-outline-light btn-sm w-100" type="submit">
                <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
            </button>
        </form>
    </nav>

    <main class="flex-grow-1 p-4">
        <div class="d-flex justify-content-between align-items-start mb-4">
            <div>
                <h1 class="h3 mb-1">Venta <span th:text="${venta.numeroVenta}">VEN-00001</span></h1>
                <p class="text-muted mb-0">
                    Fecha: <span th:text="${#temporals.format(venta.fechaHora, 'dd/MM/yyyy HH:mm')}">Fecha</span> ·
                    Cliente: <strong th:text="${venta.cliente.nombreCompleto}">Cliente</strong> ·
                    Vendedor: <span th:text="${venta.usuario.nombre}">Vendedor</span> ·
                    Pago: <span th:text="${venta.metodoPago.nombre}">Método</span>
                </p>
            </div>
            <a th:href="@{/admin/ventas}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i> Volver
            </a>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <table class="table align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Producto</th>
                        <th>Talla / Color</th>
                        <th class="text-end">Cantidad</th>
                        <th class="text-end">Precio unitario</th>
                        <th class="text-end">Subtotal</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="d : ${venta.detalles}">
                        <td th:text="${d.variante.producto.nombre}">Producto</td>
                        <td th:text="${d.variante.color.nombre + ' / ' + d.variante.talla.nombre}">Color/Talla</td>
                        <td class="text-end" th:text="${d.cantidad}">0</td>
                        <td class="text-end" th:text="'Q ' + ${#numbers.formatDecimal(d.precioUnitario, 1, 2)}">Q 0.00</td>
                        <td class="text-end" th:text="'Q ' + ${#numbers.formatDecimal(d.subtotal, 1, 2)}">Q 0.00</td>
                    </tr>
                    </tbody>
                    <tfoot>
                    <tr>
                        <th colspan="4" class="text-end">Subtotal</th>
                        <th class="text-end" th:text="'Q ' + ${#numbers.formatDecimal(venta.subtotal, 1, 2)}">Q 0.00</th>
                    </tr>
                    <tr>
                        <th colspan="4" class="text-end">Descuento</th>
                        <th class="text-end" th:text="'Q ' + ${#numbers.formatDecimal(venta.descuento, 1, 2)}">Q 0.00</th>
                    </tr>
                    <tr class="table-light">
                        <th colspan="4" class="text-end">TOTAL</th>
                        <th class="text-end fs-5" th:text="'Q ' + ${#numbers.formatDecimal(venta.total, 1, 2)}">Q 0.00</th>
                    </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </main>
</div>
</body>
</html>
