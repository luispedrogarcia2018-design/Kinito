<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva entrada - Tienda de Ropa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="d-flex">
    <nav class="bg-dark text-white p-3" style="width: 240px; min-height: 100vh;">
        <h5 class="mb-4">🏝️ Tienda de Ropa</h5>
        <ul class="nav nav-pills flex-column gap-1">
            <li class="nav-item"><a class="nav-link text-white-50" th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
            <li class="nav-item"><a class="nav-link text-white-50" th:href="@{/admin/productos}"><i class="bi bi-tags me-2"></i>Productos</a></li>
            <li class="nav-item"><a class="nav-link text-white-50" th:href="@{/admin/inventario}"><i class="bi bi-box-seam me-2"></i>Inventario</a></li>
            <li class="nav-item"><a class="nav-link text-white active" th:href="@{/admin/entradas}"><i class="bi bi-truck me-2"></i>Entradas</a></li>
        </ul>
        <form th:action="@{/logout}" method="post" class="mt-4">
            <button class="btn btn-outline-light btn-sm w-100" type="submit">
                <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
            </button>
        </form>
    </nav>

    <main class="flex-grow-1 p-4" style="max-width: 700px;">
        <h1 class="h3 mb-4">Nueva entrada de mercadería</h1>
        <p class="text-muted">El número de entrada se genera automáticamente. Después de guardar podrás agregar los productos recibidos.</p>

        <form th:action="@{/admin/entradas/nueva}" th:object="${entradaForm}" method="post" class="card card-body">
            <div class="mb-3">
                <label class="form-label">Proveedor *</label>
                <select th:field="*{proveedorId}" class="form-select"
                        th:classappend="${#fields.hasErrors('proveedorId')} ? 'is-invalid'">
                    <option value="">-- Selecciona --</option>
                    <option th:each="p : ${proveedores}" th:value="${p.id}" th:text="${p.empresa}"></option>
                </select>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('proveedorId')}" th:errors="*{proveedorId}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Observaciones</label>
                <textarea th:field="*{observaciones}" class="form-control" rows="2"></textarea>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-arrow-right-circle me-1"></i> Crear y agregar productos
                </button>
                <a th:href="@{/admin/entradas}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </main>
</div>
</body>
</html>
