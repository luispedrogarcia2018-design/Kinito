<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${usuarioForm.id == null ? 'Nuevo usuario' : 'Editar usuario'} + ' - Tienda de Ropa'">Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="d-flex">
    <nav class="bg-dark text-white p-3" style="width: 240px; min-height: 100vh;">
        <h5 class="mb-4">🏝️ Tienda de Ropa</h5>
        <ul class="nav nav-pills flex-column gap-1">
            <li class="nav-item"><a class="nav-link text-white-50" th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
            <li class="nav-item"><a class="nav-link text-white active" th:href="@{/admin/usuarios}"><i class="bi bi-person-badge me-2"></i>Usuarios</a></li>
        </ul>
        <form th:action="@{/logout}" method="post" class="mt-4">
            <button class="btn btn-outline-light btn-sm w-100" type="submit">
                <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
            </button>
        </form>
    </nav>

    <main class="flex-grow-1 p-4" style="max-width: 700px;">
        <h1 class="h3 mb-4" th:text="${usuarioForm.id == null ? 'Nuevo usuario' : 'Editar usuario'}">Usuario</h1>

        <div th:if="${errorNegocio}" class="alert alert-danger" th:text="${errorNegocio}"></div>

        <form th:action="@{/admin/usuarios/guardar}" th:object="${usuarioForm}" method="post" class="card card-body">
            <input type="hidden" th:field="*{id}">

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Nombre completo *</label>
                    <input type="text" th:field="*{nombre}" class="form-control"
                           th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Usuario (username) *</label>
                    <input type="text" th:field="*{username}" class="form-control"
                           th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Correo</label>
                    <input type="email" th:field="*{correo}" class="form-control"
                           th:classappend="${#fields.hasErrors('correo')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Rol *</label>
                    <select th:field="*{rolId}" class="form-select"
                            th:classappend="${#fields.hasErrors('rolId')} ? 'is-invalid'">
                        <option value="">-- Selecciona --</option>
                        <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.nombre}"></option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('rolId')}" th:errors="*{rolId}"></div>
                </div>

                <!-- La contraseña SOLO se pide al crear un usuario nuevo -->
                <div class="col-12" th:if="${usuarioForm.id == null}">
                    <label class="form-label">Contraseña inicial *</label>
                    <input type="password" th:field="*{passwordNueva}" class="form-control">
                    <div class="form-text">El usuario podrá cambiarla después desde su propio perfil.</div>
                </div>
                <div class="col-12" th:if="${usuarioForm.id != null}">
                    <div class="alert alert-info mb-0">
                        <i class="bi bi-info-circle me-1"></i>
                        Para cambiar la contraseña de este usuario, hazlo desde el botón
                        <i class="bi bi-key"></i> en el listado de usuarios.
                    </div>
                </div>
            </div>

            <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg me-1"></i> Guardar
                </button>
                <a th:href="@{/admin/usuarios}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </main>
</div>
</body>
</html>
