<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de productos - Tienda de Ropa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="d-flex">
    <nav class="bg-dark text-white p-3" style="width: 240px; min-height: 100vh;">
        <h5 class="mb-4">🏝️ Tienda de Ropa</h5>
        <p class="text-white-50 small">
            <a th:href="@{/admin/reportes}" class="text-white-50"><i class="bi bi-arrow-left me-1"></i> Reportes</a>
        </p>
        <form th:action="@{/logout}" method="post" class="mt-4">
            <button class="btn btn-outline-light btn-sm w-100" type="submit">
                <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
            </button>
        </form>
    </nav>

    <main class="flex-grow-1 p-4">
        <h1 class="h3 mb-4">Reporte de productos</h1>

        <div class="row g-3">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-white">Más vendidos</div>
                    <div class="card-body p-0">
                        <table class="table mb-0">
                            <tbody>
                            <tr th:each="entry : ${masVendidos}">
                                <td th:text="${entry.key}">Producto</td>
                                <td class="text-end" th:text="${entry.value} + ' unidades'">0</td>
                            </tr>
                            <tr th:if="${#maps.isEmpty(masVendidos)}"><td class="text-center text-muted py-4">Sin ventas registradas todavía.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-white">Menos vendidos</div>
                    <div class="card-body p-0">
                        <table class="table mb-0">
                            <tbody>
                            <tr th:each="entry : ${menosVendidos}">
                                <td th:text="${entry.key}">Producto</td>
                                <td class="text-end" th:text="${entry.value} + ' unidades'">0</td>
                            </tr>
                            <tr th:if="${#maps.isEmpty(menosVendidos)}"><td class="text-center text-muted py-4">Sin ventas registradas todavía.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-white">Ventas por categoría</div>
                    <div class="card-body p-0">
                        <table class="table mb-0">
                            <thead class="table-light"><tr><th>Categoría</th><th class="text-end">Total vendido</th></tr></thead>
                            <tbody>
                            <tr th:each="entry : ${porCategoria}">
                                <td th:text="${entry.key}">Categoría</td>
                                <td class="text-end" th:text="'Q ' + ${#numbers.formatDecimal(entry.value, 1, 2)}">Q 0.00</td>
                            </tr>
                            <tr th:if="${#maps.isEmpty(porCategoria)}"><td colspan="2" class="text-center text-muted py-4">Sin ventas registradas todavía.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
