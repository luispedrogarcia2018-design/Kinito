<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de ventas - Tienda de Ropa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="d-flex">
    <nav class="bg-dark text-white p-3" style="width: 240px; min-height: 100vh;">
        <h5 class="mb-4">🏝️ Tienda de Ropa</h5>
        <p class="text-white-50 small">
            <a th:href="@{/admin/reportes}" class="text-white-50"><i class="bi bi-arrow-left me-1"></i> Reportes</a>
        </p>
        <form th:action="@{/logout}" method="post" class="mt-4">
            <button class="btn btn-outline-light btn-sm w-100" type="submit">
                <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
            </button>
        </form>
    </nav>

    <main class="flex-grow-1 p-4">
        <h1 class="h3 mb-4">Reporte de ventas</h1>

        <form method="get" th:action="@{/admin/reportes/ventas}" class="card card-body mb-4">
            <div class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label">Desde</label>
                    <input type="date" name="desde" class="form-control" th:value="${reporte.desde}">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Hasta</label>
                    <input type="date" name="hasta" class="form-control" th:value="${reporte.hasta}">
                </div>
                <div class="col-md-4">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-funnel me-1"></i> Filtrar
                    </button>
                </div>
            </div>
        </form>

        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <div class="card text-center">
                    <div class="card-body">
                        <div class="text-muted small">Cantidad de ventas</div>
                        <div class="h4 mb-0" th:text="${reporte.cantidadVentas}">0</div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card text-center">
                    <div class="card-body">
                        <div class="text-muted small">Total vendido</div>
                        <div class="h4 mb-0" th:text="'Q ' + ${#numbers.formatDecimal(reporte.totalVendido, 1, 2)}">Q 0.00</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <table class="table align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Número</th>
                        <th>Fecha</th>
                        <th>Cliente</th>
                        <th>Vendedor</th>
                        <th>Método de pago</th>
                        <th class="text-end">Total</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="v : ${reporte.ventas}">
                        <td><a th:href="@{/admin/ventas/{id}(id=${v.id})}" th:text="${v.numeroVenta}">VEN-00001</a></td>
                        <td th:text="${#temporals.format(v.fechaHora, 'dd/MM/yyyy HH:mm')}">Fecha</td>
                        <td th:text="${v.cliente.nombreCompleto}">Cliente</td>
                        <td th:text="${v.usuario.nombre}">Vendedor</td>
                        <td th:text="${v.metodoPago.nombre}">Método</td>
                        <td class="text-end" th:text="'Q ' + ${#numbers.formatDecimal(v.total, 1, 2)}">Q 0.00</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(reporte.ventas)}">
                        <td colspan="6" class="text-center text-muted py-4">No hay ventas en este rango de fechas.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>
</body>
</html>
