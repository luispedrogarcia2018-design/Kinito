<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${productoForm.id == null ? 'Nuevo producto' : 'Editar producto'} + ' - Tienda de Ropa'">Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="d-flex">
    <nav class="bg-dark text-white p-3" style="width: 240px; min-height: 100vh;">
        <h5 class="mb-4">🏝️ Tienda de Ropa</h5>
        <ul class="nav nav-pills flex-column gap-1">
            <li class="nav-item"><a class="nav-link text-white-50" th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
            <li class="nav-item"><a class="nav-link text-white active" th:href="@{/admin/productos}"><i class="bi bi-tags me-2"></i>Productos</a></li>
        </ul>
        <form th:action="@{/logout}" method="post" class="mt-4">
            <button class="btn btn-outline-light btn-sm w-100" type="submit">
                <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
            </button>
        </form>
    </nav>

    <main class="flex-grow-1 p-4" style="max-width: 800px;">
        <h1 class="h3 mb-4" th:text="${productoForm.id == null ? 'Nuevo producto' : 'Editar producto'}">Producto</h1>

        <div th:if="${errorNegocio}" class="alert alert-danger" th:text="${errorNegocio}"></div>

        <form th:action="@{/admin/productos/guardar}" th:object="${productoForm}" method="post" class="card card-body">
            <input type="hidden" th:field="*{id}">

            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">SKU *</label>
                    <input type="text" th:field="*{sku}" class="form-control"
                           th:classappend="${#fields.hasErrors('sku')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('sku')}" th:errors="*{sku}"></div>
                </div>
                <div class="col-md-8">
                    <label class="form-label">Nombre *</label>
                    <input type="text" th:field="*{nombre}" class="form-control"
                           th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                </div>

                <div class="col-12">
                    <label class="form-label">Descripción</label>
                    <textarea th:field="*{descripcion}" class="form-control" rows="3"></textarea>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Categoría *</label>
                    <select th:field="*{categoriaId}" class="form-select"
                            th:classappend="${#fields.hasErrors('categoriaId')} ? 'is-invalid'">
                        <option value="">-- Selecciona --</option>
                        <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"></option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('categoriaId')}" th:errors="*{categoriaId}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Marca</label>
                    <input type="text" th:field="*{marca}" class="form-control">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Precio de compra (Q) *</label>
                    <input type="number" step="0.01" th:field="*{precioCompra}" class="form-control"
                           th:classappend="${#fields.hasErrors('precioCompra')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('precioCompra')}" th:errors="*{precioCompra}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Precio de venta (Q) *</label>
                    <input type="number" step="0.01" th:field="*{precioVenta}" class="form-control"
                           th:classappend="${#fields.hasErrors('precioVenta')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('precioVenta')}" th:errors="*{precioVenta}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Precio de oferta (Q)</label>
                    <input type="number" step="0.01" th:field="*{precioOferta}" class="form-control">
                    <div class="form-text">Déjalo vacío si no está en oferta.</div>
                </div>
            </div>

            <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg me-1"></i> Guardar
                </button>
                <a th:href="@{/admin/productos}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>

        <div class="alert alert-info mt-4" th:if="${productoForm.id != null}">
            <i class="bi bi-info-circle me-1"></i>
            Las variantes (talla/color) y el stock de este producto se administran
            desde el módulo de <strong>Inventario</strong> (próximo paso).
        </div>
    </main>
</div>
</body>
</html>
